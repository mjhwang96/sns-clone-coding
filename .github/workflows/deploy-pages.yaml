name: Deploy Vite + React App to GitHub Pages

# master에 push 되면 자동 실행
on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# GitHub Pages 배포 권한 설정
permissions:
  contents: read       # 소스 코드 읽기 권한
  pages: write         # Pages 배포 권한
  id-token: write      # 최신 deploy-pages에서 필요

jobs:
  build:
    # GitHub의 Ubuntu 서버에서 실행
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 다운로드
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Node.js 환경 셋팅 + npm 캐시
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. Vite 빌드
      - name: Build
        run: npm run build

      # 5. 빌드 결과를 artifact로 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # 6. GitHub Pages로 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4s